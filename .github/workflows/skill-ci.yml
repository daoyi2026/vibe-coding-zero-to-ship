name: Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_codex_evals:
        description: "Run live Codex routing evals (requires CODEX_ACCESS_TOKEN secret)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate skill bundle
        run: node tests/validate-structure.mjs

  live-routing-evals:
    name: Live Codex routing evals
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_codex_evals }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require short-lived Codex access token
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -z "$CODEX_ACCESS_TOKEN" ]; then
            echo "Missing repository secret CODEX_ACCESS_TOKEN."
            echo "Use a short-lived token for manual CI evals; do not commit credentials."
            exit 1
          fi

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Run isolated routing evals
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: node tests/run-codex-evals.mjs
