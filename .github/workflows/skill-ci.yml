name: Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate skill bundle
        run: node tests/validate-structure.mjs

      - name: Validate benchmark scorer syntax
        run: node --check tests/score-quality-routing.mjs

      - name: Validate installer syntax
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --help

      - name: Smoke-test safe installer behavior
        run: |
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT

          HOME="$temp_home" VIBE_SKILL_SOURCE_DIR="$PWD" bash scripts/install.sh
          test -f "$temp_home/.codex/skills/vibe-coding-zero-to-ship/SKILL.md"

          set +e
          HOME="$temp_home" VIBE_SKILL_SOURCE_DIR="$PWD" bash scripts/install.sh
          second_status="$?"
          set -e
          test "$second_status" -eq 3

          HOME="$temp_home" VIBE_SKILL_SOURCE_DIR="$PWD" bash scripts/install.sh --update
          find "$temp_home/.codex/skills" -maxdepth 1 -type d -name 'vibe-coding-zero-to-ship.backup-*' | grep -q .
